<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tài Xỉu VIP</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle,#3b0d0d,#120404);
    color:white;
    text-align:center;
}
.box,.game{
    max-width:950px;
    margin:25px auto;
    padding:25px;
    border:3px solid gold;
    border-radius:20px;
    background:#1b1b1b;
}
h1{color:gold}
input{
    padding:12px;
    font-size:18px;
    border-radius:10px;
    border:none;
    margin:8px;
}
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:gold;
    color:#7a0000;
    font-weight:bold;
    cursor:pointer;
}
.money{
    font-size:24px;
    color:#00ff99;
}
.timer{
    font-size:35px;
    color:#00ffff;
    margin:15px;
}
.table{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:25px 0;
}
.bet{
    width:200px;
    padding:25px;
    border-radius:20px;
    font-size:30px;
    cursor:pointer;
    border:3px solid gold;
    background:#8b0000;
}
.selected{
    background:gold;
    color:#8b0000;
}
.disabled{
    opacity:0.5;
    pointer-events:none;
}
.dish{
    width:280px;
    height:280px;
    margin:20px auto;
    border-radius:50%;
    background:radial-gradient(circle,#eee,#999);
    position:relative;
    overflow:hidden;
}
.dice{
    position:absolute;
    top:105px;
    left:38px;
    width:210px;
    font-size:58px;
}
.bowl{
    width:230px;
    height:140px;
    background:linear-gradient(#5b2d12,#c47a2c);
    border-radius:0 0 130px 130px;
    position:absolute;
    left:25px;
    top:55px;
    z-index:2;
    cursor:grab;
}
.shake{
    animation:shake 0.08s infinite;
}
@keyframes shake{
    0%{transform:translateX(-8px) rotate(-5deg)}
    50%{transform:translateX(8px) rotate(5deg)}
    100%{transform:translateX(-8px) rotate(-5deg)}
}
#result{
    font-size:26px;
    color:gold;
}
#hint{
    color:#00ffff;
    font-size:20px;
}
.history{
    margin-top:20px;
    color:#ccc;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
    <h1>🎲 TÀI XỈU GIẢI TRÍ 🎲</h1>

    <h2>Đăng nhập</h2>
    <input id="loginUser" placeholder="Tên đăng nhập">
    <input id="loginPass" type="password" placeholder="Mật khẩu">
    <br>
    <button onclick="dangNhap()">Đăng nhập</button>

    <h2>Đăng ký</h2>
    <input id="regUser" placeholder="Tên đăng nhập mới">
    <input id="regPass" type="password" placeholder="Mật khẩu mới">
    <br>
    <button onclick="dangKy()">Đăng ký</button>

    <p id="loginMsg"></p>
</div>

<div class="game" id="gameBox" style="display:none">
    <h1>🎲 TÀI XỈU GIẢI TRÍ 🎲</h1>

    <p>Người chơi: <b id="playerName"></b></p>
    <div class="money">Tiền ảo: <span id="money">1000</span> xu</div>

    <div class="timer">
        Thời gian đặt cược: <span id="time">30</span>s
    </div>

    <div class="table" id="betArea">
        <div class="bet" id="tai" onclick="chon('tai')">TÀI<br>11 - 18</div>
        <div class="bet" id="xiu" onclick="chon('xiu')">XỈU<br>3 - 10</div>
    </div>

    <p>Nhập số xu muốn đặt:</p>
    <input type="number" id="betMoney" value="100" min="10">
    <br><br>

    <button onclick="datCuoc()">ĐẶT CƯỢC</button>
    <button onclick="dangXuat()">Đăng xuất</button>

    <div class="dish">
        <div class="dice" id="dice">⚀ ⚀ ⚀</div>
        <div class="bowl" id="bowl"></div>
    </div>

    <div id="hint"></div>
    <div id="result"></div>
    <div class="history" id="history">Lịch sử: </div>
</div>

<script>
let currentUser = "";
let money = 1000;
let choice = "";
let daDatCuoc = false;
let tienDaDat = 0;
let luaChonDaDat = "";
let historyText = "";
let timeLeft = 30;
let timer;
let canOpen = false;
let isDragging = false;
let startY = 0;
let bowlTop = 55;
let currentResult = "";

const diceIcons = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
const bowl = document.getElementById("bowl");

function getUsers(){
    return JSON.parse(localStorage.getItem("users") || "{}");
}

function saveUsers(users){
    localStorage.setItem("users", JSON.stringify(users));
}

function dangKy(){
    let user = regUser.value.trim();
    let pass = regPass.value.trim();
    let users = getUsers();

    if(user === "" || pass === ""){
        loginMsg.innerHTML = "Vui lòng nhập đủ thông tin!";
        return;
    }

    if(users[user]){
        loginMsg.innerHTML = "Tài khoản đã tồn tại!";
        return;
    }

    users[user] = { password: pass, money: 1000, history: "" };
    saveUsers(users);
    loginMsg.innerHTML = "Đăng ký thành công, hãy đăng nhập!";
}

function dangNhap(){
    let user = loginUser.value.trim();
    let pass = loginPass.value.trim();
    let users = getUsers();

    if(!users[user] || users[user].password !== pass){
        loginMsg.innerHTML = "Sai tài khoản hoặc mật khẩu!";
        return;
    }

    currentUser = user;
    money = users[user].money;
    historyText = users[user].history;

    playerName.innerHTML = currentUser;
    document.getElementById("money").innerHTML = money;
    history.innerHTML = "Lịch sử: " + historyText;

    loginBox.style.display = "none";
    gameBox.style.display = "block";

    batDauVanMoi();
}

function luuTaiKhoan(){
    let users = getUsers();
    users[currentUser].money = money;
    users[currentUser].history = historyText;
    saveUsers(users);
}

function dangXuat(){
    luuTaiKhoan();
    location.reload();
}

function chon(type){
    if(daDatCuoc) return;

    choice = type;
    tai.classList.remove("selected");
    xiu.classList.remove("selected");
    document.getElementById(type).classList.add("selected");
}

function datCuoc(){
    let bet = Number(betMoney.value);

    if(daDatCuoc){
        alert("Bạn đã đặt cược ván này rồi!");
        return;
    }

    if(choice === ""){
        alert("Bạn chưa chọn Tài hoặc Xỉu!");
        return;
    }

    if(bet <= 0 || bet > money){
        alert("Số tiền đặt không hợp lệ!");
        return;
    }

    daDatCuoc = true;
    tienDaDat = bet;
    luaChonDaDat = choice;

    result.innerHTML = "Bạn đã đặt " + bet + " xu vào " + 
        (choice === "tai" ? "TÀI" : "XỈU") + ". Chờ hết 30 giây để mở bát.";
}

function batDauVanMoi(){
    clearInterval(timer);

    timeLeft = 30;
    choice = "";
    daDatCuoc = false;
    tienDaDat = 0;
    luaChonDaDat = "";
    canOpen = false;

    time.innerHTML = timeLeft;
    result.innerHTML = "";
    hint.innerHTML = "Hãy chọn Tài/Xỉu và đặt cược.";
    dice.innerHTML = "⚀ ⚀ ⚀";
    bowl.style.top = "55px";

    tai.classList.remove("selected");
    xiu.classList.remove("selected");

    timer = setInterval(function(){
        timeLeft--;
        time.innerHTML = timeLeft;

        if(timeLeft <= 0){
            clearInterval(timer);
            hetGioLacChen();
        }
    }, 1000);
}

function hetGioLacChen(){
    if(!daDatCuoc){
        result.innerHTML = "Bạn chưa đặt cược, ván này bỏ qua.";
        hint.innerHTML = "Chuẩn bị ván mới...";
        setTimeout(batDauVanMoi, 3000);
        return;
    }

    hint.innerHTML = "Hết giờ! Đang lắc chén...";
    result.innerHTML = "";

    bowl.classList.add("shake");

    setTimeout(function(){
        bowl.classList.remove("shake");

        let d1 = Math.floor(Math.random()*6)+1;
        let d2 = Math.floor(Math.random()*6)+1;
        let d3 = Math.floor(Math.random()*6)+1;
        let sum = d1+d2+d3;

        dice.innerHTML = diceIcons[d1]+" "+diceIcons[d2]+" "+diceIcons[d3];

        let kq = sum >= 11 ? "tai" : "xiu";
        let textKq = kq === "tai" ? "TÀI" : "XỈU";

        if(luaChonDaDat === kq){
            money += tienDaDat;
            currentResult = "🎉 Ra " + textKq + " - Tổng " + sum + 
                " | Bạn thắng +" + tienDaDat + " xu";
        }else{
            money -= tienDaDat;
            currentResult = "😢 Ra " + textKq + " - Tổng " + sum + 
                " | Bạn thua -" + tienDaDat + " xu";
        }

        document.getElementById("money").innerHTML = money;
        historyText = textKq + " (" + sum + ") | " + historyText;
        history.innerHTML = "Lịch sử: " + historyText;
        luuTaiKhoan();

        canOpen = true;
        hint.innerHTML = "Kéo chén lên để mở kết quả.";

    }, 1500);
}

bowl.addEventListener("mousedown", function(e){
    if(!canOpen) return;
    isDragging = true;
    startY = e.clientY;
    bowlTop = parseInt(bowl.style.top) || 55;
});

document.addEventListener("mousemove", function(e){
    if(!isDragging) return;

    let move = e.clientY - startY;
    let newTop = bowlTop + move;

    if(newTop < -90) newTop = -90;
    if(newTop > 55) newTop = 55;

    bowl.style.top = newTop + "px";

    if(newTop <= -60){
        result.innerHTML = currentResult;
        hint.innerHTML = "Đã mở chén! Ván mới bắt đầu sau 5 giây.";
        canOpen = false;
        isDragging = false;

        if(money <= 0){
            setTimeout(function(){
                alert("Bạn đã hết tiền ảo! Reset lại 1000 xu.");
                money = 1000;
                document.getElementById("money").innerHTML = money;
                luuTaiKhoan();
            },500);
        }

        setTimeout(batDauVanMoi, 5000);
    }
});

document.addEventListener("mouseup", function(){
    isDragging = false;
});
</script>

</body>
</html>
