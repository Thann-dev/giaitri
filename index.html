<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nổ Hũ NhanNTT</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#3a0000,#080000);
  color:white;
  text-align:center;
}
.box{
  width:420px;
  margin:40px auto;
  padding:25px;
  border-radius:20px;
  background:linear-gradient(180deg,#8b0000,#240000);
  box-shadow:0 0 30px gold;
}
input,button{
  padding:12px;
  margin:8px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button{
  background:linear-gradient(#ffd700,#ff8c00);
  font-weight:bold;
  cursor:pointer;
}
.slot{
  display:flex;
  justify-content:center;
  gap:15px;
  margin:25px 0;
}
.reel{
  width:90px;
  height:90px;
  background:#111;
  border:4px solid gold;
  border-radius:15px;
  font-size:55px;
  line-height:90px;
  box-shadow:0 0 15px gold;
}
.hidden{display:none}
.money{color:#00ff99;font-size:22px}
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h1>🎰 NỔ HŨ CLUB</h1>
  <input id="username" placeholder="Tên đăng nhập"><br>
  <input id="password" type="password" placeholder="Mật khẩu"><br>
  <button onclick="login()">Đăng nhập</button>
</div>

<div class="box hidden" id="gameBox">
  <h1>🎰 NỔ HŨ VIP</h1>
  <p>Xin chào: <b id="userShow"></b></p>
  <p class="money">Số dư: <span id="balance">100000</span> xu</p>

  <div class="slot">
    <div class="reel" id="r1">🍒</div>
    <div class="reel" id="r2">🍋</div>
    <div class="reel" id="r3">🔔</div>
  </div>

  <input id="bet" type="number" value="10000" min="1000">
  <br>
  <button onclick="spin()">QUAY</button>
  <button onclick="logout()">Đăng xuất</button>

  <h2 id="result"></h2>
</div>

<script>
let balance = 100000;
let symbols = ["🍒","🍋","🔔","⭐","💎","7️⃣"];

function login(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user === "" || pass === ""){
    alert("Vui lòng nhập tài khoản và mật khẩu");
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("gameBox").classList.remove("hidden");
  document.getElementById("userShow").innerText = user;
}

function logout(){
  document.getElementById("gameBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

function spin(){
  let bet = Number(document.getElementById("bet").value);

  if(bet <= 0 || bet > balance){
    alert("Tiền cược không hợp lệ");
    return;
  }

  balance -= bet;
  updateMoney();

  let count = 0;
  let timer = setInterval(() => {
    document.getElementById("r1").innerText = randomSymbol();
    document.getElementById("r2").innerText = randomSymbol();
    document.getElementById("r3").innerText = randomSymbol();
    count++;

    if(count > 20){
      clearInterval(timer);
      checkWin(bet);
    }
  },100);
}

function randomSymbol(){
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function checkWin(bet){
  let a = document.getElementById("r1").innerText;
  let b = document.getElementById("r2").innerText;
  let c = document.getElementById("r3").innerText;
  let result = document.getElementById("result");

  if(a === b && b === c){
    let win = bet * 10;
    balance += win;
    result.innerText = "🎉 NỔ HŨ! Thắng " + win + " xu";
  }else if(a === b || b === c || a === c){
    let win = bet * 2;
    balance += win;
    result.innerText = "✨ Thắng nhỏ " + win + " xu";
  }else{
    result.innerText = "😢 Chúc may mắn lần sau";
  }

  updateMoney();
}

function updateMoney(){
  document.getElementById("balance").innerText = balance;
}
</script>

</body>
</html>
