<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tài Xỉu Giải Trí</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:radial-gradient(circle,#3b0d0d,#120404);
    color:white;
    text-align:center;
}

h1{
    color:gold;
    text-shadow:0 0 15px red;
}

.game{
    max-width:900px;
    margin:20px auto;
    padding:20px;
    border:3px solid gold;
    border-radius:20px;
    background:#1b1b1b;
    box-shadow:0 0 30px #000;
}

.money{
    font-size:24px;
    color:#00ff99;
}

.table{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:25px 0;
}

.bet{
    width:180px;
    padding:25px;
    border-radius:20px;
    font-size:30px;
    cursor:pointer;
    border:3px solid gold;
    background:#8b0000;
    transition:0.3s;
}

.bet:hover{
    transform:scale(1.08);
    background:#b30000;
}

.selected{
    background:gold;
    color:#8b0000;
}

.dish{
    width:260px;
    height:260px;
    margin:20px auto;
    border-radius:50%;
    background:radial-gradient(circle,#eee,#999);
    position:relative;
    box-shadow:0 0 25px #000;
}

.bowl{
    width:220px;
    height:130px;
    background:linear-gradient(#5b2d12,#c47a2c);
    border-radius:0 0 120px 120px;
    position:absolute;
    left:20px;
    top:40px;
    box-shadow:0 10px 20px #000;
    z-index:2;
}

.shake{
    animation:shake 0.1s infinite;
}

@keyframes shake{
    0%{transform:translateX(-8px) rotate(-5deg);}
    50%{transform:translateX(8px) rotate(5deg);}
    100%{transform:translateX(-8px) rotate(-5deg);}
}

.dice{
    position:absolute;
    top:95px;
    left:35px;
    width:190px;
    font-size:55px;
    z-index:1;
}

input{
    padding:12px;
    font-size:20px;
    width:150px;
    text-align:center;
    border-radius:10px;
    border:none;
}

button{
    padding:14px 35px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:gold;
    color:#7a0000;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

#result{
    font-size:30px;
    color:gold;
    margin-top:20px;
}

.history{
    margin-top:20px;
    color:#ccc;
}
</style>
</head>

<body>

<div class="game">
    <h1>🎲 TÀI XỈU GIẢI TRÍ 🎲</h1>

    <div class="money">
        Tiền ảo: <span id="money">1000</span> xu
    </div>

    <div class="table">
        <div class="bet" id="tai" onclick="chon('tai')">TÀI<br>11 - 18</div>
        <div class="bet" id="xiu" onclick="chon('xiu')">XỈU<br>3 - 10</div>
    </div>

    <p>Nhập số xu muốn đặt:</p>
    <input type="number" id="betMoney" value="100" min="10">

    <div class="dish">
        <div class="dice" id="dice">⚀ ⚀ ⚀</div>
        <div class="bowl" id="bowl"></div>
    </div>

    <button onclick="lac()">LẮC CHÉN</button>

    <div id="result"></div>
    <div class="history" id="history">Lịch sử: </div>
</div>

<script>
let money = 1000;
let choice = "";
let historyText = "";

const diceIcons = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

function chon(type){
    choice = type;

    document.getElementById("tai").classList.remove("selected");
    document.getElementById("xiu").classList.remove("selected");

    document.getElementById(type).classList.add("selected");
}

function lac(){
    let bet = Number(document.getElementById("betMoney").value);

    if(choice === ""){
        alert("Bạn chưa chọn Tài hoặc Xỉu!");
        return;
    }

    if(bet <= 0 || bet > money){
        alert("Số tiền đặt không hợp lệ!");
        return;
    }

    let bowl = document.getElementById("bowl");
    let result = document.getElementById("result");

    result.innerHTML = "Đang lắc...";

    bowl.classList.add("shake");

    setTimeout(function(){
        bowl.classList.remove("shake");

        let d1 = Math.floor(Math.random()*6)+1;
        let d2 = Math.floor(Math.random()*6)+1;
        let d3 = Math.floor(Math.random()*6)+1;
        let sum = d1 + d2 + d3;

        document.getElementById("dice").innerHTML =
            diceIcons[d1] + " " + diceIcons[d2] + " " + diceIcons[d3];

        let kq = sum >= 11 ? "tai" : "xiu";
        let textKq = kq === "tai" ? "TÀI" : "XỈU";

        if(choice === kq){
            money += bet;
            result.innerHTML = "🎉 Ra " + textKq + " - Tổng " + sum + " | Bạn thắng +" + bet + " xu";
        }else{
            money -= bet;
            result.innerHTML = "😢 Ra " + textKq + " - Tổng " + sum + " | Bạn thua -" + bet + " xu";
        }

        document.getElementById("money").innerHTML = money;

        historyText = textKq + " (" + sum + ") | " + historyText;
        document.getElementById("history").innerHTML = "Lịch sử: " + historyText;

        if(money <= 0){
            alert("Bạn đã hết tiền ảo! Game sẽ reset.");
            money = 1000;
            document.getElementById("money").innerHTML = money;
        }

    }, 1500);
}
</script>

</body>
</html>
